[build-system]
requires = ["setuptools>=61", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliotheque-binding"
version = "0.1.0"
description = "Interface pybind11 pour le gestionnaire de bibliotheque C++ original"
requires-python = ">=3.12"
dependencies = ["customtkinter", "pybind11"]

# Le module Python installe est l'extension C++ ; les scripts .py du dossier
# (fenetre_test.py, test_binding.py) ne sont pas des modules a distribuer.
[tool.setuptools]
py-modules = []
